<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ER Sense - paste any error or stack trace and get a plain-English explanation, the likely causes, and a concrete fix."
    />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Fonts: Geist (UI) + Geist Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <title>ER Sense - Explain my error</title>

    <!-- Apply saved theme before paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('ersense:theme');
        if (t) {
          t = t.replace(/"/g, '');
          if (t === 'light' || t === 'dark')
            document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
